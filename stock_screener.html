<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>A股智能选股 · 主力建仓+洗盘结束信号筛选</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0b1220;
    --bg2: #0f1a2e;
    --card: #14213d;
    --card2: #1b2c4f;
    --border: #243656;
    --text: #e8eef7;
    --muted: #8a9bbd;
    --accent: #4fd1c5;
    --accent2: #3b82f6;
    --up: #ff4d4f;
    --down: #2eb872;
    --pass: #2eb872;
    --fail: #ff5c5c;
    --warn: #f5a623;
  }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: radial-gradient(1200px 800px at 10% -10%, #16284a 0%, var(--bg) 55%) fixed;
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 18px 16px 60px; }

  header {
    text-align: center;
    padding: 14px 0 6px;
  }
  header .logo {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; color: var(--accent);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 4px 12px; background: rgba(79,209,197,.06);
    margin-bottom: 12px;
  }
  header .logo .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  header h1 {
    font-size: 24px; font-weight: 800; letter-spacing: .5px;
    background: linear-gradient(90deg, #fff 10%, var(--accent) 90%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header p { color: var(--muted); font-size: 13px; margin-top: 6px; }

  .panel {
    background: linear-gradient(180deg, var(--card) 0%, var(--card2) 100%);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  .search {
    display: flex; gap: 10px; align-items: stretch;
  }
  .search input {
    flex: 1; min-width: 0;
    background: #0c1730; color: var(--text);
    border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; font-size: 16px; outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .search input::placeholder { color: #5b6b8c; }
  .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,209,197,.15); }
  .search button {
    border: none; cursor: pointer; color: #06231f; font-weight: 700;
    background: linear-gradient(135deg, var(--accent), #38bdf8);
    padding: 0 22px; border-radius: 12px; font-size: 15px;
    transition: transform .12s, filter .2s; white-space: nowrap;
  }
  .search button:active { transform: scale(.96); }
  .search button:disabled { filter: grayscale(.6) brightness(.7); cursor: not-allowed; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .chip {
    font-size: 12px; color: var(--muted); background: #0c1730;
    border: 1px solid var(--border); border-radius: 999px; padding: 6px 12px;
    cursor: pointer; transition: all .15s;
  }
  .chip:hover { color: var(--accent); border-color: var(--accent); }
  .chip b { color: var(--text); }

  .status {
    margin-top: 14px; font-size: 13px; color: var(--muted);
    min-height: 18px; display: flex; align-items: center; gap: 8px;
  }
  .spinner {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid rgba(79,209,197,.25); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  #result { margin-top: 18px; }
  .hidden { display: none !important; }

  .verdict {
    border-radius: 16px; padding: 20px; margin-bottom: 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    border: 1px solid;
  }
  .verdict.pass { background: linear-gradient(135deg, rgba(46,184,114,.22), rgba(46,184,114,.06)); border-color: rgba(46,184,114,.5); }
  .verdict.fail { background: linear-gradient(135deg, rgba(255,92,92,.18), rgba(255,92,92,.05)); border-color: rgba(255,92,92,.45); }
  .verdict .v-left .v-tag { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .verdict .v-left .v-main { font-size: 22px; font-weight: 800; }
  .verdict.pass .v-main { color: var(--pass); }
  .verdict.fail .v-main { color: var(--fail); }
  .verdict .v-sub { font-size: 12px; color: var(--muted); margin-top: 4px; max-width: 460px; }
  .verdict .v-score {
    font-size: 30px; font-weight: 800; font-variant-numeric: tabular-nums;
    padding: 8px 14px; border-radius: 12px; background: rgba(255,255,255,.05);
  }

  .head-row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin-bottom: 14px; flex-wrap: wrap;
  }
  .stk-name { font-size: 18px; font-weight: 700; }
  .stk-code { color: var(--muted); font-size: 13px; margin-left: 6px; font-weight: 400; }
  .price-box { text-align: right; }
  .price { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .chg { font-size: 13px; font-weight: 600; margin-left: 6px; }
  .up-c { color: var(--up); } .down-c { color: var(--down); }

  .grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
  }
  .kv {
    background: #0c1730; border: 1px solid var(--border); border-radius: 12px;
    padding: 12px 14px;
  }
  .kv .k { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .kv .v { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }

  .signal-row { display: flex; gap: 10px; margin-top: 10px; }
  .signal {
    flex: 1; border-radius: 12px; padding: 12px 14px; border: 1px solid var(--border);
    background: #0c1730;
  }
  .signal .k { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .signal .v { font-size: 14px; font-weight: 700; }
  .signal.good .v { color: var(--pass); }
  .signal.warn .v { color: var(--warn); }
  .signal.weak .v { color: var(--muted); }

  .conds-title {
    margin: 20px 0 10px; font-size: 13px; color: var(--muted);
    display: flex; align-items: center; gap: 8px;
  }
  .conds-title::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  .cond {
    display: flex; align-items: flex-start; gap: 12px;
    background: #0c1730; border: 1px solid var(--border); border-radius: 12px;
    padding: 14px; margin-bottom: 10px; transition: border-color .2s;
  }
  .cond.ok { border-color: rgba(46,184,114,.5); }
  .cond.no { border-color: rgba(255,92,92,.4); }
  .badge {
    flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-weight: 800;
    font-size: 14px; margin-top: 1px;
  }
  .badge.ok { background: rgba(46,184,114,.18); color: var(--pass); }
  .badge.no { background: rgba(255,92,92,.16); color: var(--fail); }
  .cond .body { flex: 1; min-width: 0; }
  .cond .ttl { font-size: 15px; font-weight: 600; }
  .cond .desc { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.5; }
  .cond .val {
    margin-top: 8px; font-size: 13px; color: var(--text);
    background: rgba(255,255,255,.04); border-radius: 8px; padding: 6px 10px;
    display: inline-block; font-variant-numeric: tabular-nums;
  }
  .cond.ok .val { color: var(--pass); }
  .cond.no .val { color: var(--fail); }

  .chart-box {
    margin-top: 18px; background: #0c1730; border: 1px solid var(--border);
    border-radius: 12px; padding: 14px;
  }
  .chart-box .ct { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  svg.spark { width: 100%; height: 90px; display: block; }

  .disc {
    margin-top: 18px; font-size: 11px; color: #5b6b8c; line-height: 1.6;
    text-align: center; padding: 0 6px;
  }
  @media (max-width: 520px) {
    header h1 { font-size: 20px; }
    .grid { grid-template-columns: 1fr 1fr; }
    .verdict .v-main { font-size: 18px; }
    .verdict .v-score { font-size: 24px; }
    .search button { padding: 0 16px; font-size: 14px; }
    .signal-row { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><span class="dot"></span>实时数据 · 智能筛选</div>
    <h1>A股主力建仓 + 洗盘结束信号筛选器</h1>
    <p>输入股票代码，自动校验5项条件是否符合主力底部建仓痕迹与洗盘结束拉升信号</p>
  </header>

  <div class="panel">
    <div class="search">
      <input id="codeInput" type="tel" inputmode="numeric" maxlength="6" placeholder="输入6位股票代码，如 000001 或 600519" />
      <button id="analyzeBtn">开始分析</button>
    </div>
    <div class="chips">
      <span class="chip" data-code="000001"><b>000001</b> 平安银行</span>
      <span class="chip" data-code="600519"><b>600519</b> 贵州茅台</span>
      <span class="chip" data-code="002594"><b>002594</b> 比亚迪</span>
      <span class="chip" data-code="300750"><b>300750</b> 宁德时代</span>
      <span class="chip" data-code="601318"><b>601318</b> 中国平安</span>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div id="result" class="hidden"></div>

  <div class="disc">
    数据来源：东方财富行情接口（与 AKShare 同源 A 股数据）。<br>
    筛选逻辑仅供技术研究，不构成任何投资建议。股市有风险，入市需谨慎。<br>
    建议在交易时段内使用，盘中数据实时更新；非交易时段将使用最近交易日收盘数据。
  </div>
</div>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };
  var codeInput = $("codeInput"), btn = $("analyzeBtn"), statusEl = $("status"), resultEl = $("result");

  // ---- 工具：东方财富 secid 前缀 ----
  function toSecid(code) {
    code = String(code).trim();
    if (!/^\d{6}$/.test(code)) return null;
    var c = code.charAt(0);
    var prefix;
    if (c === "6") prefix = "1";        // 上交所
    else if (c === "0" || c === "3") prefix = "0";   // 深交所
    else if (c === "8" || c === "4") prefix = "0";   // 北交所（兼容尝试）
    else prefix = "0";
    return prefix + "." + code;
  }

  // ---- JSONP 请求 ----
  function jsonp(url) {
    return new Promise(function (resolve, reject) {
      var cbName = "__stk_cb_" + Date.now() + "_" + Math.floor(Math.random() * 1000000);
      window[cbName] = function (data) {
        cleanup();
        resolve(data);
      };
      var script = document.createElement("script");
      script.async = true;
      var sep = url.indexOf("?") >= 0 ? "&" : "?";
      script.src = url + sep + "cb=" + cbName;
      script.onerror = function () { cleanup(); reject(new Error("网络请求失败，可能被网络环境拦截")); };
      document.body.appendChild(script);
      var timer = setTimeout(function () { cleanup(); reject(new Error("请求超时，请重试")); }, 15000);
      function cleanup() {
        clearTimeout(timer);
        if (window[cbName]) { try { delete window[cbName]; } catch (e) { window[cbName] = undefined; } }
        if (script.parentNode) script.parentNode.removeChild(script);
      }
    });
  }

  // ---- 获取日K线（含今日盘中）----
  function fetchKlines(code) {
    var secid = toSecid(code);
    if (!secid) return Promise.reject(new Error("股票代码格式不正确，需6位数字"));
    var url =
      "https://push2his.eastmoney.com/api/qt/stock/kline/get" +
      "?secid=" + secid +
      "&fields1=f1,f2,f3,f4,f5,f6" +
      "&fields2=f51,f52,f53,f54,f55,f56,f57,f58" +
      "&klt=101&fqt=1&beg=0&end=20500101&lmt=40";
    return jsonp(url).then(function (res) {
      if (!res || !res.data || !res.data.klines || !res.data.klines.length) {
        throw new Error("未获取到该股票的数据，请检查代码是否正确");
      }
      var bars = res.data.klines.map(parseKline).filter(function (b) { return b && !isNaN(b.close); });
      if (bars.length < 16) throw new Error("历史数据不足，无法完成分析（需至少16个交易日）");
      return { name: res.data.name || code, code: code, bars: bars };
    });
  }

  // 解析单根K线：date,open,close,high,low,volume,turnover,amplitude
  function parseKline(line) {
    var p = line.split(",");
    return {
      date: p[0],
      open: parseFloat(p[1]),
      close: parseFloat(p[2]),
      high: parseFloat(p[3]),
      low: parseFloat(p[4]),
      volume: parseFloat(p[5]),     // 手
      turnover: parseFloat(p[6]),   // 元
      amplitude: parseFloat(p[7]) || 0
    };
  }

  // ---- 核心分析逻辑 ----
  function analyze(stock) {
    var bars = stock.bars;
    var n = bars.length;
    var today = bars[n - 1];
    var prev = bars[n - 2];

    var price = today.close;
    var changePct = ((price - prev.close) / prev.close) * 100;
    var turnover = today.turnover;

    // 条件1：股价 5~100 元
    var c1 = {
      pass: price >= 5 && price <= 100,
      val: price.toFixed(2) + " 元",
      desc: "筛选低价-中价活跃个股，剔除过高股价与1元边缘低价股"
    };

    // 条件2：今日涨幅 2%~7%
    var c2 = {
      pass: changePct >= 2 && changePct <= 7,
      val: (changePct >= 0 ? "+" : "") + changePct.toFixed(2) + "%",
      desc: "温和启动上涨，排除一字涨停（追高风险）与无涨幅个股"
    };

    // 条件3：成交额 > 1亿
    var c3 = {
      pass: turnover > 1e8,
      val: (turnover / 1e8).toFixed(2) + " 亿",
      desc: "成交活跃，资金参与度高，具备主力运作空间"
    };

    // 条件4：最近5日，至少3天放量（>前10日均量1.3倍）且5日累计涨幅<5%
    var last5 = bars.slice(n - 5);
    var spikeDays = 0;
    for (var i = n - 5; i < n; i++) {
      if (i - 10 < 0) continue;
      var prev10 = bars.slice(i - 10, i);
      var sum = 0; for (var j = 0; j < prev10.length; j++) sum += prev10[j].volume;
      var avgVol = sum / prev10.length;
      if (avgVol > 0 && bars[i].volume > 1.3 * avgVol) spikeDays++;
    }
    var cumGain5 = ((last5[4].close - last5[0].close) / last5[0].close) * 100;
    var c4 = {
      pass: spikeDays >= 3 && cumGain5 < 5,
      val: "放量 " + spikeDays + "/5 天，累计 " + (cumGain5 >= 0 ? "+" : "") + cumGain5.toFixed(2) + "%",
      desc: "识别主力底部建仓痕迹：放量但股价未大涨，资金隐蔽吸筹"
    };

    // 条件5：最近3日 出现长下影线 或 缩量横盘，且今日站上5日均线
    var last3 = bars.slice(n - 3);

    var hasLongLower = last3.some(function (b) {
      var body = Math.abs(b.close - b.open);
      var lower = Math.min(b.open, b.close) - b.low;
      return body > 0 && lower > body * 2 && (lower / b.low) > 0.005;
    });

    var amps = last3.map(function (b) { return b.amplitude || ((b.high - b.low) / b.low * 100); });
    var lowAmp = amps.every(function (a) { return a < 3; });
    var vols3 = last3.map(function (b) { return b.volume; });
    var shrinking = vols3[2] < vols3[1] && vols3[1] < vols3[0];
    var sideways = lowAmp && shrinking;

    var ma5Sum = 0; for (var k = n - 5; k < n; k++) ma5Sum += bars[k].close;
    var ma5 = ma5Sum / 5;
    var aboveMA5 = price > ma5;

    var c5 = {
      pass: (hasLongLower || sideways) && aboveMA5,
      val: (hasLongLower ? "长下影线 " : "") + (sideways ? "缩量横盘 " : "") + (aboveMA5 ? "· 站上5日线" : "· 未站上5日线"),
      desc: "判断洗盘结束、可能即将拉升：长下影=承接有力，缩量横盘=浮筹清洗完毕"
    };

    var conds = [c1, c2, c3, c4, c5];
    var passCount = conds.filter(function (c) { return c.pass; }).length;
    var allPass = passCount === 5;

    // 主力资金信号
    var mainForceSignal, mainClass;
    if (c4.pass) { mainForceSignal = "主力建仓信号明显"; mainClass = "good"; }
    else if (spikeDays >= 2) { mainForceSignal = "有主力活动迹象"; mainClass = "warn"; }
    else { mainForceSignal = "主力信号不明显"; mainClass = "weak"; }

    // 洗盘状态
    var washStatus, washClass;
    if (c5.pass) { washStatus = "洗盘结束，可能即将拉升"; washClass = "good"; }
    else if (sideways) { washStatus = "缩量横盘洗盘中"; washClass = "warn"; }
    else if (hasLongLower) { washStatus = "出现长下影，关注止跌"; washClass = "warn"; }
    else { washStatus = "尚无明确洗盘结束信号"; washClass = "weak"; }

    return {
      name: stock.name, code: stock.code,
      price: price, changePct: changePct, turnover: turnover,
      ma5: ma5, ma5Pass: aboveMA5,
      spikeDays: spikeDays, cumGain5: cumGain5,
      conds: conds, passCount: passCount, allPass: allPass,
      mainForceSignal: mainForceSignal, mainClass: mainClass,
      washStatus: washStatus, washClass: washClass,
      bars: bars
    };
  }

  // ---- 渲染 ----
  function render(r) {
    var upCls = r.changePct >= 0 ? "up-c" : "down-c";
    var chgStr = (r.changePct >= 0 ? "+" : "") + r.changePct.toFixed(2) + "%";

    var condsHtml = r.conds.map(function (c, idx) {
      var ok = c.pass;
      return '<div class="cond ' + (ok ? "ok" : "no") + '">' +
        '<div class="badge ' + (ok ? "ok" : "no") + '">' + (ok ? "✓" : "✕") + '</div>' +
        '<div class="body">' +
          '<div class="ttl">条件' + (idx + 1) + (idx === 3 ? "（主力建仓）" : idx === 4 ? "（洗盘结束）" : "") + '</div>' +
          '<div class="desc">' + c.desc + '</div>' +
          '<div class="val">' + c.val + '</div>' +
        '</div>' +
      '</div>';
    }).join("");

    var spark = sparkSvg(r.bars.slice(-20));

    var html =
      '<div class="verdict ' + (r.allPass ? "pass" : "fail") + '">' +
        '<div class="v-left">' +
          '<div class="v-tag">综合判定</div>' +
          '<div class="v-main">' + (r.allPass ? "符合全部条件" : "未完全符合") + '</div>' +
          '<div class="v-sub">' +
            (r.allPass
              ? "主力底部建仓 + 洗盘结束信号共振，可作为重点观察标的"
              : "满足 " + r.passCount + "/5 项条件，暂未形成完整信号共振，建议继续观察") +
          '</div>' +
        '</div>' +
        '<div class="v-score">' + r.passCount + '/5</div>' +
      '</div>' +

      '<div class="panel">' +
        '<div class="head-row">' +
          '<div><span class="stk-name">' + esc(r.name) + '</span><span class="stk-code">' + r.code + '</span></div>' +
          '<div class="price-box"><span class="price ' + upCls + '">' + r.price.toFixed(2) + '</span><span class="chg ' + upCls + '">' + chgStr + '</span></div>' +
        '</div>' +
        '<div class="grid">' +
          kv("最新价", r.price.toFixed(2) + " 元") +
          kv("今日涨跌", chgStr, r.changePct >= 0 ? "up-c" : "down-c") +
          kv("成交额", (r.turnover / 1e8).toFixed(2) + " 亿") +
          kv("5日均线", r.ma5.toFixed(2) + " 元" + (r.ma5Pass ? "（站上）" : "（之下）"), r.ma5Pass ? "" : "down-c") +
        '</div>' +
        '<div class="signal-row">' +
          sig("主力资金信号", r.mainForceSignal, r.mainClass) +
          sig("洗盘状态", r.washStatus, r.washClass) +
        '</div>' +
      '</div>' +

      '<div class="chart-box">' +
        '<div class="ct">最近 20 个交易日收盘价走势</div>' +
        spark +
      '</div>' +

      '<div class="conds-title">五项条件逐一校验</div>' +
      condsHtml;

    resultEl.innerHTML = html;
    resultEl.classList.remove("hidden");
  }

  function kv(k, v, cls) {
    return '<div class="kv"><div class="k">' + k + '</div><div class="v ' + (cls || "") + '">' + v + '</div></div>';
  }
  function sig(k, v, cls) {
    return '<div class="signal ' + (cls || "") + '"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>';
  }
  function esc(s) { return String(s).replace(/[<>&"]/g, function (c) { return { "<": "&lt;", ">": "&gt;", "&": "&amp;", '"': "&quot;" }[c]; }); }

  // 简单 SVG sparkline
  function sparkSvg(arr) {
    if (!arr || !arr.length) return "";
    var w = 600, h = 90, pad = 4;
    var vals = arr.map(function (b) { return b.close; });
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    var range = max - min || 1;
    var step = (w - pad * 2) / (vals.length - 1);
    var pts = vals.map(function (v, i) {
      var x = pad + i * step;
      var y = pad + (h - pad * 2) * (1 - (v - min) / range);
      return x.toFixed(1) + "," + y.toFixed(1);
    }).join(" ");
    var up = vals[vals.length - 1] >= vals[0];
    var col = up ? "#ff4d4f" : "#2eb872";
    var last = pts.split(" ").pop().split(",");
    var lx = parseFloat(last[0]), ly = parseFloat(last[1]);
    return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
      '<defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" stop-color="' + col + '" stop-opacity="0.35"/>' +
        '<stop offset="100%" stop-color="' + col + '" stop-opacity="0"/>' +
      '</linearGradient></defs>' +
      '<polyline points="' + pad + ',' + (h - pad) + ' ' + pts + ' ' + (w - pad) + ',' + (h - pad) + '" fill="url(#g1)" stroke="none"/>' +
      '<polyline points="' + pts + '" fill="none" stroke="' + col + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
      '<circle cx="' + lx + '" cy="' + ly + '" r="3.5" fill="' + col + '"/>' +
    '</svg>';
  }

  // ---- 状态提示 ----
  function setStatus(text, loading) {
    if (!text) { statusEl.innerHTML = ""; return; }
    statusEl.innerHTML = (loading ? '<span class="spinner"></span>' : "") + "<span>" + esc(text) + "</span>";
  }

  // ---- 执行 ----
  function run() {
    var code = codeInput.value.trim();
    if (!/^\d{6}$/.test(code)) { setStatus("请输入6位数字股票代码"); resultEl.classList.add("hidden"); return; }
    btn.disabled = true;
    setStatus("正在获取行情数据并分析…", true);
    resultEl.classList.add("hidden");
    fetchKlines(code).then(function (stock) {
      var r = analyze(stock);
      render(r);
      setStatus("");
    }).catch(function (err) {
      setStatus("分析失败：" + err.message);
      resultEl.classList.add("hidden");
    }).then(function () { btn.disabled = false; });
  }

  btn.addEventListener("click", run);
  codeInput.addEventListener("keydown", function (e) { if (e.key === "Enter") run(); });
  document.querySelectorAll(".chip").forEach(function (el) {
    el.addEventListener("click", function () {
      codeInput.value = el.getAttribute("data-code");
      run();
    });
  });
})();
</script>
</body>
</html>
